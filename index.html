<style>
/* Layout: one column of app screens (max 620px) under an indigo band, with a fixed action bar
   (Retirar / Devolver + navegação) at the bottom, like a phone app on any screen size. */
:root{
  --bg:#f4f2ee; --surface:#ffffff; --surface-2:#f8f6f2; --ink:#1e262e; --muted:#636d77; --line:#e4e0d8;
  --head:#27323d; --brand:#27323d; --brand-ink:#ffffff; --brand-soft:#efe5d6; --accent:#8a5a24; --plate:#ffffff;
  --ok-bg:#e3f4ae; --ok-ink:#3a5400; --use-bg:#cdeff8; --use-ink:#0a5a70;
  --stop-bg:#fde0d6; --stop-ink:#97320f; --park-bg:#e2e7ed; --park-ink:#27323d;
  --go:#86c51f; --go-ink:#203300; --back:#93d7ee; --back-ink:#073b4b;
  --bar:#2f6f8f; --danger:#c0352b; --danger-soft:#fbe4e1; --shadow:0 1px 2px rgba(30,38,46,.06),0 6px 20px rgba(30,38,46,.06);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13171c; --surface:#1b2128; --surface-2:#222932; --ink:#ebeef1; --muted:#9ca7b2; --line:#2d3540;
  --head:#1f2831; --brand:#3b4b5b; --brand-ink:#ffffff; --brand-soft:#3a2f22; --accent:#e3ad6e; --plate:#ffffff;
  --ok-bg:#2b3a10; --ok-ink:#cdee86; --use-bg:#0f3845; --use-ink:#a2e4f6;
  --stop-bg:#42231a; --stop-ink:#ffb59c; --park-bg:#26313c; --park-ink:#cfdae5;
  --go:#7ab51a; --go-ink:#162400; --back:#5fb8d6; --back-ink:#062a36;
  --bar:#7cc0dc; --danger:#ff7a6e; --danger-soft:#3d1c1a; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13171c; --surface:#1b2128; --surface-2:#222932; --ink:#ebeef1; --muted:#9ca7b2; --line:#2d3540;
  --head:#1f2831; --brand:#3b4b5b; --brand-ink:#ffffff; --brand-soft:#3a2f22; --accent:#e3ad6e; --plate:#ffffff;
  --ok-bg:#2b3a10; --ok-ink:#cdee86; --use-bg:#0f3845; --use-ink:#a2e4f6;
  --stop-bg:#42231a; --stop-ink:#ffb59c; --park-bg:#26313c; --park-ink:#cfdae5;
  --go:#7ab51a; --go-ink:#162400; --back:#5fb8d6; --back-ink:#062a36;
  --bar:#7cc0dc; --danger:#ff7a6e; --danger-soft:#3d1c1a; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{background:var(--head);color:#ffffff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.logo{width:44px;height:44px;flex:none;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.school{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#e3ad6e;line-height:1.2}
.brand{min-width:0;flex:1}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.brand h1 span{font-weight:600;color:#e3ad6e}
.who{font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-btn{background:rgba(255,255,255,.14);border:0;color:inherit;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px}
.top-btn:hover{background:rgba(255,255,255,.24)}
.mode{font-size:12.5px;padding:8px 12px;border-radius:var(--r-sm);background:var(--stop-bg);color:var(--stop-ink);margin-top:12px}

main{padding-block:16px 190px}
.stack{display:flex;flex-direction:column;gap:14px}

/* Segmented controls */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--surface-2);border:1px solid var(--line);padding:4px;border-radius:999px}
.seg button{border:0;background:transparent;border-radius:999px;padding:9px 10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);box-shadow:var(--shadow)}
.seg.small button{padding:6px 10px;font-size:13.5px}
.seg.soft button[aria-pressed="true"]{background:var(--brand-soft);color:var(--ink);box-shadow:none}

/* Stat tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:var(--r);padding:12px 14px 14px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between}
.tile .lbl{font-size:13px;font-weight:600}
.tile .num{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.t-ok{background:var(--ok-bg);color:var(--ok-ink)} .t-use{background:var(--use-bg);color:var(--use-ink)}
.t-stop{background:var(--stop-bg);color:var(--stop-ink)} .t-park{background:var(--park-bg);color:var(--park-ink)}
.note{font-size:12.5px;color:var(--muted)}

/* Cards and lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.sec-h h2{font-size:17px;font-weight:800}
.sec-h .note{white-space:nowrap}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty svg{display:block;margin:0 auto 10px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;padding:3px 8px;border-radius:999px;background:var(--use-bg);color:var(--use-ink)}
.chip.done{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.chip.conf{background:var(--stop-bg);color:var(--stop-ink)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.badge.late{background:var(--danger-soft);color:var(--danger)}

/* Buttons */
.btn{border:0;border-radius:var(--r-sm);padding:11px 16px;font-weight:700;background:var(--brand);color:var(--brand-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%;padding:14px 16px;font-size:15.5px}
.btn.go{background:var(--go);color:var(--go-ink)}
.btn.back{background:var(--back);color:var(--back-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:999px}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.link{border:0;background:none;padding:4px 2px;color:var(--accent);font-weight:700}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.mini.warn{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.mini.go{border-color:var(--go);background:var(--go);color:var(--go-ink)}

/* Forms */
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:11px 12px;font-size:15px;color:var(--ink)}
textarea.inp{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.grid2.hora{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px 8px;align-items:end;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grid2.hora .n{grid-column:1/3}
.grid2.hora .hx{grid-column:3;grid-row:1}
.grid2.hora .inp{padding:9px 8px;font-size:14px}
@media (min-width:520px){.grid2.hora{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto;border-bottom:0;padding-bottom:0}.grid2.hora .n{grid-column:auto}.grid2.hora .hx{grid-column:4}}

/* Agenda */
.datebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.datebar .grow{flex:1 1 180px;min-width:0}
.datebar .ctrl{display:flex;align-items:center;gap:6px;margin-left:auto}
.datebar .d1{font-weight:700}
.datebar input[type=date]{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-sm);padding:7px 8px;color:var(--ink)}
.slot{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.slot .t{font-weight:700}
.slot .s{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.free{min-width:52px;text-align:center;border-radius:var(--r-sm);background:var(--ok-bg);color:var(--ok-ink);padding:4px 6px;line-height:1}
.free b{font-family:var(--f-display);font-size:22px;display:block;font-variant-numeric:tabular-nums}
.free small{font-size:11px}
.free.zero{background:var(--danger-soft);color:var(--danger)}
.res{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.res-i{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:var(--r-sm);padding:8px 10px;font-size:13.5px}
.res-i .grow{flex:1;min-width:0;overflow-wrap:anywhere}

/* Equipment grid */
.codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;max-height:300px;overflow-y:auto;padding:2px}
.code{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 2px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center}
.code[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.code.inuse{background:var(--use-bg);color:var(--use-ink);border-color:transparent}
.code.manut{background:var(--stop-bg);color:var(--stop-ink);border-color:transparent}
.code.baixa{background:color-mix(in srgb,var(--muted) 28%,var(--surface));color:var(--muted);text-decoration:line-through;border-color:transparent}
.grp{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 5px}
.grp:first-child{margin-top:0}
.codes-wrap{max-height:340px;overflow-y:auto;padding:2px}
.codes-wrap .codes{max-height:none;overflow:visible;padding:0}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* History */
.day{font-size:13px;font-weight:700;margin:4px 0 2px;display:flex;justify-content:space-between;color:var(--muted)}
.day b{color:var(--ink)}
.time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;align-self:flex-start;padding-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--go);flex:none;align-self:flex-start;margin-top:7px}
.dot.open{background:var(--back)}

/* Messages */
.msg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.msg.pin{border-color:var(--brand);background:color-mix(in srgb,var(--brand-soft) 55%,var(--surface))}
.msg p{margin:4px 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg .meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.msg .meta .grow{flex:1}

/* Bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{padding-block:10px 4px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts .btn{padding:14px;font-size:16px;border-radius:12px}
nav.tabs{display:grid;grid-template-columns:repeat(6,1fr);margin-top:6px}
nav.tabs [data-act]{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative;text-decoration:none}
nav.tabs [aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:22px;height:22px}
nav.tabs .pip{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;line-height:16px;padding:0 4px}

/* Sheet (modal) */
.ov{position:fixed;inset:0;z-index:40;background:rgba(18,16,40,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet>*{flex-shrink:0}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:20px;max-height:86vh;padding:22px}}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h2{flex:1;font-size:20px;font-weight:800}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;color:var(--muted)}
.step{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pick{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto}
.pick button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 12px}
.pick button .s{display:block;font-size:12px;color:var(--muted)}
.chosen{display:flex;align-items:center;gap:10px;background:var(--brand-soft);color:var(--ink);border-radius:var(--r-sm);padding:10px 12px}
.chosen .grow{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.stepper{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stepper input{width:76px;text-align:center}
.sum{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px}

.toast{position:fixed;left:50%;bottom:calc(170px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow);text-align:center}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:380px){.tile .num{font-size:34px} nav.tabs [data-act]{font-size:10.5px}}
@media (prefers-reduced-motion: no-preference){.sheet.anim{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
.install{display:flex;gap:12px;align-items:center;background:var(--brand-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px}
.install .grow{flex:1;min-width:0;font-size:13.5px}
.install b{display:block;font-size:14.5px}
.login{max-width:420px;margin:24px auto 0}
.plate{background:var(--plate);border-radius:var(--r);padding:14px;display:grid;place-items:center}
.plate img{width:200px;height:auto}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.rtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.rtile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.rtile b{font-family:var(--f-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.rtile span{font-size:12.5px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:2px}
.bar-r{display:grid;grid-template-columns:minmax(0,10rem) minmax(0,1fr) auto;gap:10px;align-items:center;padding:4px 0}
.bar-l{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-t{height:10px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar-f{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.bar-v{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink);min-width:2.5em;text-align:right}
@media (max-width:420px){.bar-r{grid-template-columns:minmax(0,7rem) minmax(0,1fr) auto}}
.imp{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--line);border-radius:var(--r-sm);padding:12px}
#print{display:none}
@media print{
  @page{size:A4;margin:10mm}
  :root{padding:0!important}
  body{background:#fff!important}
  body::before{display:none!important}
  body>*:not(#print){display:none!important}
  #print{display:block!important;color:#111;font-family:var(--f-body)}
  #print *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .rtiles{grid-template-columns:repeat(5,1fr)} #print .rtile{border-color:#bbb;background:#fff} #print .rtile span{color:#444}
  #print .bar-t{background:#eee} #print .bar-f{background:#555} #print .bar-v,#print .bar-l{color:#111}
  #print .rsec{break-inside:avoid;margin-top:5mm} #print .rsec h2{font-size:12pt;margin:0 0 2mm}
  .etqs{display:grid;grid-template-columns:repeat(3,1fr)}
  .lst-h{display:flex;align-items:center;gap:4mm;margin-bottom:4mm}
  .lst-h img{width:16mm;height:16mm;object-fit:contain}
  .lst-h h1{font-family:var(--f-display);font-size:16pt;margin:0}
  .lst-h p{margin:1mm 0 0;font-size:8.5pt;color:#444}
  .lst-res{font-size:9pt;margin:0 0 3mm}
  .lst{width:100%;border-collapse:collapse;font-size:8.5pt}
  .lst th,.lst td{border:1px solid #bbb;padding:1.2mm 1.6mm;text-align:left;vertical-align:top}
  .lst th{background:#eee;font-weight:700}
  .lst thead{display:table-header-group}
  .lst tr{break-inside:avoid}
  .lst .g td{background:#f4f1ea;font-weight:700;font-size:9pt}
  .lst .ok{width:7mm}
  .lst .st{font-weight:700}
  .lst-ass{display:flex;gap:10mm;margin-top:8mm;font-size:9pt}
  .lst-ass span{flex:1;border-top:1px solid #333;padding-top:1mm}
  .etq{display:flex;align-items:center;gap:3mm;height:27mm;padding:2mm 3mm;border:1px dashed #999;break-inside:avoid;color:#111;font-family:var(--f-body)}

<script>
(() => {
"use strict";

/* ---------- Utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const keyToDate = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const hhmm = (t) => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtLong = new Intl.DateTimeFormat("pt-BR", { day: "numeric", month: "long", year: "numeric" });
const fmtWeek = new Intl.DateTimeFormat("pt-BR", { weekday: "long" });
const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const TIPOS = { NB: { nome: "Notebooks", um: "notebook", campo: "notebooks" }, TB: { nome: "Tablets", um: "tablet", campo: "tablets" } };
const SEGS = { medio: "Ensino Médio", fund: "Fundamental" };
const FINS = ["Aula regular", "Agendamento", "Uso administrativo", "Outro"];
const store = {
  get(k, d) { try { const v = localStorage.getItem("parquetec:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("parquetec:" + k, JSON.stringify(v)); } catch {} }
};
function dayLabel(k) {
  const today = dayKey(), y = new Date(); y.setDate(y.getDate() - 1);
  const d = keyToDate(k), base = `${fmtWeek.format(d)}, ${fmtLong.format(d)}`;
  if (k === today) return ["Hoje", base];
  if (k === dayKey(y)) return ["Ontem", base];
  return ["", base.charAt(0).toUpperCase() + base.slice(1)];
}
async function sha(s) {
  try {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("parquetec|" + s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  } catch { let h = 0; for (const c of "parquetec|" + s) h = (h * 31 + c.charCodeAt(0)) | 0; return "h" + h; }
}

/* ---------- Banco de dados: nuvem (claude.ai) ou local ---------- */
function localDB() {
  const KEY = "parquetec:local-db";
  let data = {}; try { data = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch {}
  const subs = new Set();
  const clone = (v) => JSON.parse(JSON.stringify(v));
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} setTimeout(() => subs.forEach(f => f())); };
  const merge = (a, b) => { const o = { ...a }; for (const [k, v] of Object.entries(b)) o[k] = v && typeof v === "object" && !Array.isArray(v) && o[k] && typeof o[k] === "object" && !Array.isArray(o[k]) ? merge(o[k], v) : v; return o; };
  const snap = (path) => { const d = data[path]; return { id: path.split("/").pop(), exists: !!d, data: () => d ? clone(d) : undefined, metadata: { fromCache: false, hasPendingWrites: false } }; };
  const ops = { "==": (a, b) => a === b, "!=": (a, b) => a !== b, "<": (a, b) => a < b, "<=": (a, b) => a <= b, ">": (a, b) => a > b, ">=": (a, b) => a >= b, "in": (a, b) => b.includes(a) };
  const docRef = (path) => ({
    id: path.split("/").pop(), path,
    get: async () => snap(path),
    set: async (v) => { data[path] = clone(v); save(); },
    update: async (v) => { if (!data[path]) throw { code: "invalid_argument", message: "missing" }; data[path] = merge(data[path], clone(v)); save(); },
    delete: async () => { delete data[path]; save(); },
    onSnapshot: (next) => { const f = () => next(snap(path)); subs.add(f); setTimeout(f); return () => subs.delete(f); }
  });
  const query = (col, filters = [], ord = null, lim = 0) => {
    const depth = col.split("/").length + 1;
    const run = () => {
      let docs = Object.keys(data).filter(p => p.startsWith(col + "/") && p.split("/").length === depth).map(snap);
      docs = docs.filter(d => filters.every(([f, op, v]) => ops[op](d.data()[f], v)));
      if (ord) docs.sort((a, b) => { const x = a.data()[ord[0]], y = b.data()[ord[0]]; return (x > y ? 1 : x < y ? -1 : 0) * (ord[1] === "desc" ? -1 : 1); });
      else docs.sort((a, b) => a.id < b.id ? -1 : 1);
      if (lim) docs = docs.slice(0, lim);
      return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
    };
    return {
      where: (f, op, v) => query(col, [...filters, [f, op, v]], ord, lim),
      orderBy: (f, dir = "asc") => query(col, filters, [f, dir], lim),
      limit: (n) => query(col, filters, ord, n),
      get: async () => run(),
      onSnapshot: (next) => { const f = () => next(run()); subs.add(f); setTimeout(f); return () => subs.delete(f); }
    };
  };
  return {
    doc: docRef,
    collection: (col) => ({ ...query(col), path: col, doc: (id) => docRef(col + "/" + (id || uid())), add: async (v) => { const r = docRef(col + "/" + uid()); await r.set(v); return r; } }),
    umaVez: async (path, campo) => { const d = data[path]; if (!d || d[campo]) return false; d[campo] = Date.now(); save(); return true; }
  };
}

/* Firebase (Firestore + login por e-mail), usado quando config.js traz a configuração do projeto. */
async function firebaseDB(conf) {
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [appM, fs, au] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-firestore.js"), import(base + "firebase-auth.js")]);
  const app = appM.initializeApp(conf);
  let db;
  try { db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
  catch { db = fs.getFirestore(app); }
  const auth = au.getAuth(app);
  // Segunda instância só para criar logins de outras pessoas sem desconectar quem está usando.
  const auth2 = au.initializeAuth(appM.initializeApp(conf, "cadastro"), { persistence: au.inMemoryPersistence });
  const P = (p) => `escolas/${conf.escola || "principal"}/${p}`;
  const snapOf = (d) => ({ id: d.id, exists: d.exists(), data: () => d.data(), metadata: d.metadata });
  const qsnap = (s) => ({ docs: s.docs.map(snapOf), size: s.size, empty: s.empty, metadata: s.metadata });
  // Sem internet a gravação fica guardada no aparelho e sobe sozinha depois; não trava a tela esperando o servidor.
  const queued = (p) => { p.catch(e => { console.warn(e); toast(errMsg(e), 6000); }); return Promise.race([p, new Promise(r => setTimeout(r, 1500))]); };
  const docRef = (path) => {
    const r = fs.doc(db, P(path));
    return {
      id: r.id, path,
      get: async () => snapOf(await fs.getDoc(r)),
      set: (v) => queued(fs.setDoc(r, v)),
      update: (v) => queued(fs.setDoc(r, v, { merge: true })),
      delete: () => queued(fs.deleteDoc(r)),
      onSnapshot: (next, err) => fs.onSnapshot(r, s => next(snapOf(s)), err)
    };
  };
  const query = (col, cons = []) => {
    const q = () => fs.query(fs.collection(db, P(col)), ...cons);
    return {
      where: (f, op, v) => query(col, [...cons, fs.where(f, op, v)]),
      orderBy: (f, dir = "asc") => query(col, [...cons, fs.orderBy(f, dir)]),
      limit: (n) => query(col, [...cons, fs.limit(n)]),
      get: async () => qsnap(await fs.getDocs(q())),
      onSnapshot: (next, err) => fs.onSnapshot(q(), s => next(qsnap(s)), err)
    };
  };
  return {
    db: { doc: docRef, collection: (col) => ({ ...query(col), path: col, doc: (id) => docRef(col + "/" + (id || uid())) }),
      umaVez: (path, campo) => fs.runTransaction(db, async (tx) => { const r = fs.doc(db, P(path)), d = await tx.get(r); if (!d.exists() || d.data()[campo]) return false; tx.update(r, { [campo]: Date.now() }); return true; }).catch(() => false) },
    onAuth: (fn) => au.onAuthStateChanged(auth, fn),
    login: (email, senha) => au.signInWithEmailAndPassword(auth, email, senha),
    reset: (email) => au.sendPasswordResetEmail(auth, email),
    logout: () => au.signOut(auth),
    criarConta: async (email, senha) => {
      try { await au.createUserWithEmailAndPassword(auth2, email, senha); await au.signOut(auth2); return true; }
      catch (e) { if (e && e.code === "auth/email-already-in-use") return false; throw e; }
    },
    criarMinha: (email, senha) => au.createUserWithEmailAndPassword(auth, email, senha),
    criarDono: async (email, senha) => { const c = await au.createUserWithEmailAndPassword(auth, email, senha); await au.sendEmailVerification(c.user); },
    reenviar: () => au.sendEmailVerification(auth.currentUser),
    recarregar: async () => { await auth.currentUser.reload(); await auth.currentUser.getIdToken(true); return auth.currentUser; }
  };
}

let DB = null, MODE = "local", downloads = null, FB = null, AUTH = null, installEvt = null;
const HOSTED = !(window.claude && typeof window.claude.use === "function");
const STANDALONE = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const S = { config: null, configLoaded: false, pessoas: [], abertos: [], hist: [], parados: [], reservas: [], recados: [], acessos: [], inv: {}, resHoje: [], futuras: [], pedidos: [], meuPedido: null };
const CONF = window.PARQUETEC_FIREBASE || {};
const meuEmail = () => String(AUTH && AUTH.email || "").toLowerCase();
const souDono = () => !!(CONF.dono && meuEmail() === String(CONF.dono).toLowerCase());
const meuAcesso = () => S.meuAc || S.acessos.find(a => a.id === meuEmail());
// Fora do Firebase não há logins: quem abre o app pode tudo.
const isAdmin = () => MODE !== "firebase" || souDono() || (meuAcesso() || {}).papel === "admin";
// Equipe = coordenação e operadores: registram retiradas e devoluções. Professor só agenda.
const isEquipe = () => isAdmin() || (meuAcesso() || {}).papel === "operador";
const isProfessor = () => MODE === "firebase" && !isEquipe() && (meuAcesso() || {}).papel === "professor";
const PAPEIS = { admin: "Coordenação", operador: "Operador", professor: "Professor" };
function minhaPessoa() { const a = meuAcesso() || {}; return pessoa(a.pessoaId) || { id: a.pessoaId || "login:" + meuEmail(), nome: a.nome || meuEmail(), cargo: PAPEIS[a.papel] || "" }; }
// Aviso por e-mail para a coordenação (Google Apps Script da escola, se configurado no config.js).
function avisarEmail(dados) {
  if (!CONF.avisoEmail) return;
  try { fetch(CONF.avisoEmail, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ ...dados, app: location.href.split("#")[0] }) }).catch(() => {}); } catch {}
}
// Aviso no aparelho (enquanto o app estiver aberto, mesmo minimizado).
function avisarAparelho(titulo, corpo) {
  toast(titulo + ": " + corpo, 6000);
  try {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    const opt = { body: corpo, icon: "icons/icon-192.png", badge: "icons/icon-192.png", tag: "parquetec-" + Date.now() };
    if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r => r.showNotification(titulo, opt)).catch(() => {});
    else new Notification(titulo, opt);
  } catch {}
}
const ui = {
  tab: store.get("tab", "painel"), tipo: "NB", seg: store.get("seg", "medio"), date: dayKey(),
  histQ: "", histLimit: 100, histModo: "lista", rel: { periodo: "mes" }, gerTipo: "NB", gerQ: "", showInativos: false, armed: null, unlocked: false
};
// "Quem está usando" fica guardado por login, para aparelhos compartilhados.
const opKey = () => "operador" + (AUTH ? ":" + meuEmail() : "");
let operador = store.get("operador", null);
const unsub = {};

function defaultConfig() {
  return {
    escola: "", notebooks: 0, tablets: 0, whatsapp: "", pinHash: "", limite: "18:00",
    horarios: {
      medio: [["1ª aula", "07:00", "07:50"], ["2ª aula", "07:50", "08:40"], ["3ª aula", "08:40", "09:30"], ["4ª aula", "09:50", "10:40"], ["5ª aula", "10:40", "11:30"], ["6ª aula", "11:30", "12:20"]].map(([nome, ini, fim], i) => ({ id: "m" + (i + 1), nome, ini, fim })),
      fund: [["1ª aula", "13:00", "13:50"], ["2ª aula", "13:50", "14:40"], ["3ª aula", "14:40", "15:30"], ["4ª aula", "15:50", "16:40"], ["5ª aula", "16:40", "17:30"]].map(([nome, ini, fim], i) => ({ id: "f" + (i + 1), nome, ini, fim }))
    }
  };
}
const cfg = () => S.config || defaultConfig();

function listen(name, ref, apply) {
  if (unsub[name]) unsub[name]();
  unsub[name] = ref.onSnapshot(snap => { apply(snap); scheduleRender(); }, err => {
    console.warn(name, err);
    if (err && err.code === "revoked") toast("O acesso a este app foi alterado. Recarregue a página.");
    if (err && err.code === "permission-denied") { ui.semAcesso = true; scheduleRender(); }
  });
}
const docsOf = (snap) => snap.docs.map(d => ({ id: d.id, ...d.data() }));

function subscribeAll() {
  listen("config", DB.doc("config/main"), s => { S.config = s.exists ? { ...defaultConfig(), ...s.data() } : null; S.configLoaded = true; setTimeout(garantirIdsAulas); });
  if (MODE !== "firebase") subscribePessoas();
  listen("abertos", DB.collection("emprestimos").where("aberto", "==", true), s => {
    const antes = new Set(S.abertos.flatMap(e => aConferir(e).map(c => e.id + c))), primeira = !S.abertosOk;
    S.abertos = docsOf(s).filter(e => Array.isArray(e.codes) && e.retiradoEm).sort((a, b) => b.retiradoEm - a.retiradoEm); S.abertosOk = true;
    if (primeira || !isEquipe()) return;
    for (const e of S.abertos) { const novos = aConferir(e).filter(c => !antes.has(e.id + c)); if (novos.length) avisarAparelho("Devolução para conferir", `${e.pessoaNome} marcou ${resumoCodes(novos, e.tipo)} como devolvido.`); }
  });
  listen("parados", DB.collection("parados"), s => { S.parados = docsOf(s); });
  listen("inv", DB.doc("config/inventario"), s => { S.inv = s.exists ? (s.data().itens || {}) : {}; });
  listen("recados", DB.collection("recados").orderBy("em", "desc").limit(30), s => { S.recados = docsOf(s); });
  if (ui.tab === "historico") subscribeHist();
  subscribeReservas(); subscribeResHoje();
  if (MODE !== "firebase") subscribeFuturas();
  if (MODE === "firebase") listen("meuPedido", DB.doc("pedidos/" + meuEmail()), s => {
    const tinha = S.pedidoNoServidor; S.pedidoNoServidor = s.exists; S.meuPedido = s.exists ? s.data() : S.meuPedido;
    // Pedido aprovado (apagado) enquanto a pessoa esperava: abre o app.
    if (tinha && !s.exists && ui.semAcesso) location.reload();
  });
  // Leituras do Firebase contam no limite grátis: cada um baixa só o que usa.
  if (MODE === "firebase") listen("meuAc", DB.doc("acessos/" + meuEmail()), s => { S.meuAc = s.exists ? { id: s.id, ...s.data() } : null; aposAcesso(); });
}
function aposAcesso() {
  setTimeout(garantirIdsAulas);
  if (isEquipe() && !unsub.pessoas) subscribePessoas();
  if (isEquipe() && !unsub.futuras) subscribeFuturas();
  if (isEquipe() && !unsub.acessos) listen("acessos", DB.collection("acessos"), s => {
    S.acessos = docsOf(s);
    if (isAdmin() && !unsub.pedidos) listen("pedidos", DB.collection("pedidos"), q => {
      const antes = new Set(S.pedidos.map(x => x.id)), primeira = !S.pedidosOk;
      S.pedidos = docsOf(q).filter(x => x.status !== "recusado"); S.pedidosOk = true;
      if (!primeira) for (const x of S.pedidos) if (!antes.has(x.id)) avisarAparelho("Pedido de acesso", `${x.nome} (${x.id}) quer entrar no app.`);
    });
  });
  const a = meuAcesso();
  // Com login, quem autoriza é sempre a pessoa logada.
  if (MODE === "firebase" && operador && !String(operador.id).startsWith("login:")) operador = null;
  if (!operador && a && a.nome) { operador = { id: "login:" + a.id, nome: a.nome, cargo: PAPEIS[a.papel] || "" }; store.set(opKey(), operador); }
  else if (!operador && souDono()) { operador = { id: "login:" + meuEmail(), nome: "Coordenação", cargo: "" }; store.set(opKey(), operador); }
}
let idsAulasFeito = false;
function garantirIdsAulas() {
  if (idsAulasFeito || !isAdmin() || !S.config) return;
  const c = JSON.parse(JSON.stringify(S.config)); delete c.id; let mudou = false;
  for (const seg of Object.keys(SEGS)) (c.horarios[seg] || []).forEach((a, i) => { if (!a.id) { a.id = seg[0] + "p" + (i + 1); mudou = true; } });
  idsAulasFeito = true;
  if (mudou) write(() => DB.doc("config/main").set(c));
}
function subscribePessoas() { listen("pessoas", DB.collection("pessoas"), s => { S.pessoas = docsOf(s).sort((a, b) => norm(a.nome) < norm(b.nome) ? -1 : 1); }); }
function subscribeHist() { listen("hist", DB.collection("emprestimos").orderBy("retiradoEm", "desc").limit(ui.histLimit), s => { S.hist = docsOf(s); }); }
// Histórico só é baixado quando a aba é aberta.
function garantirHist() { if (!unsub.hist && DB) subscribeHist(); }
function subscribeFuturas() {
  listen("futuras", DB.collection("reservas").where("data", ">=", dayKey()), s => {
    const antes = new Set(S.futuras.map(r => r.id)), primeira = !S.futurasOk;
    S.futuras = docsOf(s); S.futurasOk = true;
    if (primeira) return;
    for (const r of S.futuras) if (!antes.has(r.id) && ativa(r) && r.criadoPorEmail && r.criadoPorEmail !== meuEmail()) {
      const [rel, base] = dayLabel(r.data);
      avisarAparelho(pendente(r) ? "Agendamento para aprovar" : "Novo agendamento", `${r.pessoaNome}: ${resumoItens(r.itens, r.qtd, r.tipo)} · ${rel || base} · ${r.aulaNome || ""}`);
    }
  });
}
function subscribeResHoje() {
  listen("resHoje", DB.collection("reservas").where("data", "==", dayKey()), s => {
    const antes = new Map(S.resHoje.map(r => [r.id, r.status])), antesAp = new Set(S.resHoje.filter(r => r.aprovado).map(r => r.id)), primeira = !S.resHojeOk;
    S.resHoje = docsOf(s); S.resHojeOk = true;
    if (!primeira && !isEquipe()) for (const r of S.resHoje) if (r.aprovado === true && ativa(r) && !antesAp.has(r.id) && antes.has(r.id) && paraMim(r)) avisarAparelho("Agendamento aprovado", `Seu agendamento de hoje (${resumoItens(r.itens, r.qtd, r.tipo)}) foi aprovado. Na hora, toque em Retirar.`);
    if (!primeira) for (const r of S.resHoje) if (r.status === "recusado" && antes.has(r.id) && antes.get(r.id) !== "recusado" && paraMim(r)) avisarAparelho("Agendamento recusado", `A coordenação recusou seu agendamento de hoje (${resumoItens(r.itens, r.qtd, r.tipo)}).`);
  });
}
function subscribeReservas() { listen("reservas", DB.collection("reservas").where("data", "==", ui.date), s => { S.reservas = docsOf(s); }); }

function errMsg(e) {
  const code = e && e.code;
  return code === "invalid_argument" || code === "permission-denied" ? "Você não tem permissão para alterar os dados. Entre com um usuário autorizado."
    : code === "quota_exceeded" ? "O espaço de dados está cheio. Apague recados antigos e tente de novo."
    : code === "resource_exhausted" || code === "resource-exhausted" ? "Muitas ações seguidas. Espere alguns segundos e tente de novo."
    : "Não deu para salvar agora. Confira a internet e tente de novo.";
}
async function write(fn, okMsg, ms) {
  try { await fn(); if (okMsg) toast(okMsg, ms); return true; }
  catch (e) { toast(errMsg(e), 5000); console.warn(e); return false; }
}

/* ---------- Estado derivado ---------- */
function codesFor(t) { const n = Math.max(0, Math.min(200, Number(cfg()[TIPOS[t].campo]) || 0)); return Array.from({ length: n }, (_, i) => `${t}-${String(i + 1).padStart(3, "0")}`); }
function emUsoMap() {
  const m = new Map();
  for (const e of S.abertos) for (const c of e.codes || []) if (!(e.devolvidos || {})[c]) m.set(c, e);
  return m;
}
function paradosMap() { const m = new Map(); for (const p of S.parados) m.set(p.id, p); return m; }
function stats(t) {

function disponiveis(t) { const uso = emUsoMap(), par = paradosMap(); return codesFor(t).filter(c => !uso.has(c) && !par.has(c)); }
function pendentes(e) { return (e.codes || []).filter(c => !(e.devolvidos || {})[c]); }
const pessoa = (id) => S.pessoas.find(p => p.id === id);
const inv = (c) => S.inv[c] || {};
const buscaCod = (c) => norm([c, inv(c).modelo, inv(c).patrimonio, inv(c).local].join(" ")).replace(/\s/g, "");
const dicaCod = (c) => { const i = inv(c); return [i.modelo, i.patrimonio && "Patrimônio " + i.patrimonio, i.local].filter(Boolean).join(" · "); };
// Códigos agrupados por modelo (quando o inventário foi importado).
function codeGrid(codes, btn) {

  for (const c of codes) { const m = inv(c).modelo || ""; if (!g.has(m)) g.set(m, []); g.get(m).push(c); }
  if (g.size === 1 && g.has("")) return `<div class="codes">${codes.map(btn).join("")}</div>`;
  return [...g].map(([m, l]) => `<div class="grp"><span>${esc(m || "Sem modelo")}</span><span>${l.length}</span></div><div class="codes">${l.map(btn).join("")}</div>`).join("");
}
const ativa = (r) => r.status !== "recusado";
// Cada aula tem um id fixo: mudar horário ou apagar outra aula não troca os agendamentos de lugar.
// Agendamentos antigos (sem aulaId) continuam achando a aula pela posição.
const aulasDe = (seg) => cfg().horarios[seg] || [];
function aulaDe(r) { const l = aulasDe(r.seg); return r.aulaId ? l.find(a => a.id === r.aulaId) : l[r.aula]; }
function naAula(r, seg, idx) { const a = aulasDe(seg)[idx]; return r.seg === seg && (r.aulaId ? !!a && a.id === r.aulaId : r.aula === idx); }
const posAula = (r) => { const l = aulasDe(r.seg), i = r.aulaId ? l.findIndex(a => a.id === r.aulaId) : r.aula; return i < 0 ? 99 : Number(i) || 0; };
// Até quando a retirada deve voltar: fim da aula agendada (+30 min) ou o horário limite do dia.
function prazoDevolucao(st) {
  const r = st.resId && [...S.reservas, ...S.resHoje].find(x => x.id === st.resId);
  const a = r && aulaDe(r);
  if (a && /^\d\d:\d\d$/.test(a.fim || "")) { const [h, m] = a.fim.split(":").map(Number), d = keyToDate(r.data); d.setHours(h, m + 30, 0, 0); if (d.getTime() > Date.now() + 15 * 60000) return d.getTime(); }
  const [h, m] = String(cfg().limite || "18:00").split(":").map(Number), d = new Date();
  d.setHours(isNaN(h) ? 18 : h, isNaN(m) ? 0 : m, 0, 0);
  if (d.getTime() < Date.now() + 30 * 60000) d.setDate(d.getDate() + 1);
  return d.getTime();
}
const prazoDe = (e) => e.devolverAte || (() => { const d = new Date(e.retiradoEm); d.setHours(23, 59, 0, 0); return d.getTime(); })();
const atrasado = (e) => pendentes(e).length > aConferirN(e) && Date.now() > prazoDe(e);
const aConferirN = (e) => Object.keys(e.aDevolver || {}).filter(c => !(e.devolvidos || {})[c] && (e.codes || []).includes(c)).length;
const fmtPrazo = (t) => { const k = dayKey(new Date(t)); return `${k === dayKey() ? "hoje" : dayLabel(k)[0] === "Ontem" ? "ontem" : k.split("-").reverse().slice(0, 2).join("/")} às ${hhmm(t)}`; };

function alertaRes(r) {

}
async function recusarReservas(lista, motivo) {

}
// Agendamento do professor fica aguardando aprovação; depois de aprovado, ele mesmo retira.
const feitoRes = (r) => !!(r.retirado || S.abertos.some(e => e.reservaId === r.id));
// Agendamentos de antes da aprovação (sem o campo "aprovado") contam como aprovados, mas só a equipe retira.
const pendente = (r) => ativa(r) && r.aprovado === false && !feitoRes(r);
const destinoRes = (r) => "paraEmail" in r ? r.paraEmail : r.criadoPorEmail;
const paraMim = (r) => !!meuEmail() && (destinoRes(r) === meuEmail() || (!!r.pessoaId && r.pessoaId === (meuAcesso() || {}).pessoaId));
const podeRetirar = (r) => ativa(r) && !pendente(r) && !feitoRes(r) && r.data === dayKey() && (isEquipe() || (r.aprovado === true && paraMim(r)));
const loginDaPessoa = (id) => { const a = S.acessos.find(x => x.pessoaId && x.pessoaId === id); return a ? a.id : ""; };
const somaQ = (o) => Object.values(o || {}).reduce((a, n) => a + (parseInt(n) || 0), 0);
function resumoItens(itens, total, tipo) {
  const e = Object.entries(itens || {}).filter(([, n]) => Number(n) > 0);
  if (!e.length) return `${total} ${Number(total) === 1 ? TIPOS[tipo].um : TIPOS[tipo].nome.toLowerCase()}`;
  return e.map(([m, n]) => `${n} ${m}`).join(" + ");
}
function resumoCodes(codes, tipo) {
  const o = {}; let semModelo = 0;
  for (const c of codes) { const m = inv(c).modelo; if (m) o[m] = (o[m] || 0) + 1; else semModelo++; }
  if (semModelo) { if (!Object.keys(o).length) return resumoItens(null, codes.length, tipo); o["sem modelo"] = semModelo; }
  return resumoItens(o, codes.length, tipo);
}
// Quantos ainda dá para agendar numa aula: no total e de cada modelo.
function livresSlot(t, seg, idx) {
  const st = stats(t), par = paradosMap();
  const res = S.reservas.filter(r => r.tipo === t && naAula(r, seg, idx) && ativa(r));
  const total = Math.max(0, st.parque - st.manut - res.reduce((a, r) => a + (Number(r.qtd) || 0), 0));
  const porModelo = {};
  for (const m of modelosDe(t)) {
    const cap = codesFor(t).filter(c => inv(c).modelo === m && !par.has(c)).length;

}

function agendadosHoje(t) {

  const lista = S.resHoje.filter(r => r.tipo === t && (ativa(r) || paraMim(r) || r.criadoPorEmail === meuEmail())).sort((a, b) => ordem(a) - ordem(b));

  const acao = (r) => {
    if (!ativa(r)) return `<span class="badge late">recusado pela coordenação</span>`;
    if (feitoRes(r)) return `<span class="badge">retirado</span>`;
    if (isEquipe() && pendente(r)) return `<div style="display:flex;gap:6px">${nega(r)}<button class="btn go sm" data-act="aprovar-res" data-id="${r.id}">Aprovar</button></div>`;

/* ---------- Relatório de uso ---------- */
const PERIODOS = { mes: "Este mês", passado: "Mês passado", d30: "Últimos 30 dias", ano: "Este ano" };
function periodo(k) {
  const n = new Date(), ini = new Date(n.getFullYear(), n.getMonth(), 1);
  if (k === "passado") return [new Date(n.getFullYear(), n.getMonth() - 1, 1).getTime(), ini.getTime()];
  if (k === "d30") return [Date.now() - 30 * 864e5, Date.now() + 864e5];
  if (k === "ano") return [new Date(n.getFullYear(), 0, 1).getTime(), Date.now() + 864e5];
  return [ini.getTime(), Date.now() + 864e5];
}
async function carregarRelatorio() {
  const per = ui.rel.periodo, [ini, fim] = periodo(per);
  ui.rel.carregando = per; render();
  try {
    const q = await DB.collection("emprestimos").where("retiradoEm", ">=", ini).limit(3000).get();
    const lista = q.docs.map(d => ({ id: d.id, ...d.data() })).filter(e => e.retiradoEm < fim);
    ui.rel.dados = calcRelatorio(lista); ui.rel.dadosPer = per;
  } catch (e) { console.warn(e); toast("Não deu para montar o relatório agora. Confira a internet."); }
  ui.rel.carregando = null; render();
}
function calcRelatorio(lista) {
  const conta = () => new Map(), soma = (m, k, n = 1) => m.set(k, (m.get(k) || 0) + n);
  const pessoasEq = conta(), pessoasRet = conta(), turmas = conta(), modelos = conta(), dias = conta(), fins = conta();
  let equip = 0, atrasos = 0, defeitos = 0;
  const DS = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
  for (const e of lista) {
    const n = (e.codes || []).length; equip += n;
    soma(pessoasEq, e.pessoaNome || "Sem nome", n); soma(pessoasRet, e.pessoaNome || "Sem nome");
    soma(turmas, e.turma || "Sem turma", n); soma(fins, e.finalidade || "Outro", n);
    soma(dias, DS[new Date(e.retiradoEm).getDay()], n);
    for (const c of e.codes || []) soma(modelos, inv(c).modelo || "Sem modelo");
    const dev = Object.values(e.devolvidos || {});
    if (dev.some(d => d.atrasado) || (pendentes(e).length && Date.now() > prazoDe(e))) atrasos++;
    defeitos += dev.filter(d => d.defeito).length;
  }
  const ord = (m) => [...m].sort((a, b) => b[1] - a[1]);
  const diasOrd = DS.slice(1).concat(DS[0]).filter(d => dias.has(d)).map(d => [d, dias.get(d)]);
  return { retiradas: lista.length, equip, pessoas: pessoasEq.size, atrasos, defeitos, porPessoa: ord(pessoasEq).map(([k, v]) => [k, v, pessoasRet.get(k)]), porTurma: ord(turmas), porModelo: ord(modelos), porDia: diasOrd, porFin: ord(fins) };
}
function barras(linhas, unidade, max = 10) {
  if (!linhas.length) return `<div class="note">Nada no período.</div>`;
  const mostrar = linhas.slice(0, max), topo = Math.max(...mostrar.map(l => l[1]), 1);
  return `<div class="bars">${mostrar.map(([k, v, extra]) => `<div class="bar-r" title="${esc(k)}: ${v} ${unidade}${extra ? ` em ${extra} retirada${extra === 1 ? "" : "s"}` : ""}"><span class="bar-l">${esc(k)}</span><span class="bar-t"><span class="bar-f" style="width:${Math.round(v / topo * 100)}%"></span></span><span class="bar-v">${v}</span></div>`).join("")}</div>
    ${linhas.length > max ? `<div class="note">e mais ${linhas.length - max}</div>` : ""}`;
}
function corpoRelatorio(D) {
  return `<div class="rtiles">
      <div class="rtile"><b>${D.retiradas}</b><span>${D.retiradas === 1 ? "retirada" : "retiradas"}</span></div>

function vHistorico() {

function vHistoricoLista() {
  const q = norm(ui.histQ);
  const rows = S.hist.filter(e => !q || norm([e.pessoaNome, e.turma, e.finalidade, e.operador, ...(e.codes || [])].join(" ")).includes(q));
  const byDay = new Map();
  for (const e of rows) { const k = dayKey(new Date(e.retiradoEm)); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(e); }
  let body = "";
  for (const [k, list] of byDay) {
    const [rel, base] = dayLabel(k), qtd = list.reduce((s, e) => s + (e.codes || []).length, 0);
    body += `<div class="day"><span>${rel ? `<b>${rel}</b> · ` : ""}${esc(base)}</span><span>${qtd}</span></div>
      <section class="card" style="padding-block:4px"><div class="list">${list.map(e => {
        const pend = pendentes(e), dev = e.devolvidos || {};
        const ultima = Object.values(dev).reduce((m, d) => Math.max(m, d.em || 0), 0);
        const estado = pend.length ? `<b style="color:var(--use-ink)">em uso (${pend.length})</b>` : `devolvido às ${hhmm(e.devolvidoEm || ultima)}`;
        return `<div class="row"><span class="dot ${pend.length ? "open" : ""}"></span><div class="grow">
          <div class="t">${esc(e.pessoaNome)}${e.turma ? ` <span class="note">· ${esc(e.turma)}</span>` : ""}</div>
          <div class="s">${esc(e.finalidade)} · ${esc(resumoCodes(e.codes || [], e.tipo))} · ${estado}${e.operador ? ` · autorizado por ${esc(e.operador)}` : ""}${e.obs ? ` · ${esc(e.obs)}` : ""}</div>
          <div class="chips">${(e.codes || []).map(c => `<span class="chip ${dev[c] ? (dev[c].defeito ? "conf" : "done") : ""}" title="${esc(dev[c] && dev[c].defeito ? "Voltou com problema: " + dev[c].defeito : "")}">${c}</span>`).join("")}</div>
          ${Object.entries(dev).filter(([, d]) => d.defeito).length ? `<div class="s" style="color:var(--stop-ink)">Com problema: ${Object.entries(dev).filter(([, d]) => d.defeito).map(([c, d]) => `${c} (${esc(d.defeito)})`).join(", ")}</div>` : ""}
          ${Object.values(dev).some(d => d.atrasado) || (pend.length && Date.now() > prazoDe(e)) ? `<div class="s" style="color:var(--danger)">Devolução atrasada</div>` : ""}
        </div><span class="time">${hhmm(e.retiradoEm)}</span></div>`;
      }).join("")}</div></section>`;
  }
  return `<input class="inp" id="hist-q" type="search" placeholder="Buscar por equipamento, pessoa ou turma" value="${esc(ui.histQ)}">
    ${downloads ? `<button class="btn ghost block" data-act="planilha">Baixar planilha do histórico</button>` : ""}
    ${body || `<div class="card empty">${q ? "Nada encontrado com essa busca." : "Ainda não há retiradas. Toque em Retirar para registrar a primeira."}</div>`}
    ${S.hist.length >= ui.histLimit ? `<button class="btn ghost block" data-act="mais-hist">Mostrar retiradas mais antigas</button>` : ""}`;
}

/* ---------- Inventário (modelo, patrimônio e local de cada equipamento) ---------- */
function parseCSV(t) {
  t = t.replace(/^\ufeff/, "");
  const first = t.split(/\r?\n/)[0] || "", d = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ";" : ",";
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === d) { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && t[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
function lerInventario(text) {
  const rows = parseCSV(text);
  const H = (rows[0] || []).map(norm), col = (...ns) => H.findIndex(h => ns.some(n => h.includes(n)));
  const iC = col("codigo"), iM = col("modelo"), iL = col("lote"), iP = col("patrimonio"), iLo = col("local"), iS = col("situacao", "status"), iMo = col("motivo", "observ");
  let iMa = col("marca"); if (iMa === iM) iMa = -1;
  if (iC < 0) throw new Error("A planilha precisa de uma coluna “Código” (NB-001, NB-002…).");
  const itens = {}, parar = []; let nb = 0, tb = 0;
  for (const r of rows.slice(1)) {
    const m = String(r[iC] || "").trim().toUpperCase().replace(/\s/g, "").match(/^(NB|TB)-?(\d{1,3})$/);
    if (!m) continue;
    const n = Number(m[2]); if (n < 1 || n > 200) continue;
    const c = `${m[1]}-${String(n).padStart(3, "0")}`, g = (i) => i >= 0 ? String(r[i] ?? "").trim() : "";
    if (m[1] === "NB") nb = Math.max(nb, n); else tb = Math.max(tb, n);
    itens[c] = { modelo: [g(iMa), g(iM)].filter(Boolean).join(" "), lote: g(iL), patrimonio: g(iP), local: g(iLo) };
    const sit = norm(g(iS));
    if (sit.startsWith("baixa") || sit.includes("inserv")) parar.push({ code: c, estado: "baixa", motivo: g(iMo) });
    else if (sit.startsWith("manut")) parar.push({ code: c, estado: "manut", motivo: g(iMo) });
  }
  const total = Object.keys(itens).length;
  if (!total) throw new Error("Não achei nenhum código NB-… ou TB-… na planilha.");
  return { itens, parar, nb, tb, total, modelos: new Set(Object.values(itens).map(i => i.modelo).filter(Boolean)).size };
}
function lerArquivoInventario(file) {
  const r = new FileReader();
  r.onload = () => { try { ui.importPrev = lerInventario(String(r.result)); render(); } catch (e) { toast(e.message || "Não consegui ler essa planilha.", 6000); } };
  r.onerror = () => toast("Não consegui abrir o arquivo.");
  r.readAsText(file, "utf-8");
}

const modal = { render: null, state: null,
  open(fn, state) { this.render = fn; this.state = state; this.draw(true); },
  close() { this.render = null; this.state = null; $("#modal").innerHTML = ""; document.body.style.overflow = ""; },
  draw(first) {
    if (!this.render) return;
    const a = document.activeElement, fid = a && a.id, sel = a && "selectionStart" in a ? [a.selectionStart, a.selectionEnd] : null;
    const sc = $("#modal .sheet") ? $("#modal .sheet").scrollTop : 0;
    $("#modal").innerHTML = `<div class="ov" data-act="ov"><div class="sheet${first ? " anim" : ""}" role="dialog" aria-modal="true">${this.render(this.state)}</div></div>`;
    document.body.style.overflow = "hidden";
    const sh = $("#modal .sheet"); if (sh) sh.scrollTop = sc;
    if (first) { const f = $("#modal [autofocus]"); if (f && matchMedia("(min-width:700px)").matches) f.focus(); }
    else if (fid) { const el = document.getElementById(fid); if (el) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch {} } }
  },
  refresh() { if (this.state && this.state.live) this.draw(false); }
};
const head = (t) => `<div class="sheet-h"><h2>${t}</h2><button class="x" data-act="fechar" aria-label="Fechar">×</button></div>`;

function personPicker(st, idp, opts = {}) {
  if (st.pessoa) return `<div class="chosen"><div class="grow">${esc(st.pessoa.nome)}<div class="note" style="color:inherit;font-weight:500">${esc(st.pessoa.cargo || st.pessoa.tipo || "")}</div></div><button class="mini" data-act="pp-limpar">Trocar</button></div>`;
  const q = norm(st.q);
  let pool = S.pessoas.filter(p => p.ativo !== false && (!opts.soProf || p.tipo !== "Aluno"));
  const hits = (q ? pool.filter(p => norm(p.nome + " " + (p.cargo || "")).includes(q)) : pool).slice(0, 8);
  return `<input class="inp" id="${idp}" type="search" autocomplete="off" placeholder="Digite o nome" value="${esc(st.q || "")}" autofocus>
    <div class="pick">${hits.map(p => `<button data-act="pp-escolher" data-id="${p.id}">${esc(p.nome)}<span class="s">${esc(p.cargo || p.tipo || "")}</span></button>`).join("")}

    ${!hits.length && !st.q ? `<span class="note">Ninguém cadastrado ainda. Digite o nome para cadastrar.</span>` : ""}</div>`;
}

// Separa os primeiros códigos livres de cada modelo, nas quantidades pedidas.
function separarPorModelo(st, quieto) {
  const disp = disponiveis(st.tipo); st.sel.clear(); const faltou = [];
  for (const [m, q] of Object.entries(st.qtds)) {
    const n = parseInt(q) || 0; if (!n) continue;
    const livres = disp.filter(c => inv(c).modelo === m);
    livres.slice(0, n).forEach(c => st.sel.add(c));
    if (livres.length < n) faltou.push(`${m}: só ${livres.length}`);
  }
  if (faltou.length && !quieto) toast("Não tem tudo disponível. " + faltou.join(" · "), 5000);
  else if (faltou.length) st.aviso = "Nem todos os modelos agendados estão disponíveis agora. " + faltou.join(" · ");
}
function openRetirar(pref = {}) {
  const tipo = pref.tipo || ui.tipo;
  const st = { live: true, tipo, pessoa: pref.pessoa || null, q: "", fin: pref.fin || "Aula regular", turma: pref.turma || "", obs: "", sel: new Set(), qtd: "", resId: pref.resId || null, codeQ: "", modelo: "", qtds: { ...(pref.itens || {}) }, fixo: !!pref.fixo, lim: pref.fixo ? { ...(pref.itens || {}) } : null, limQtd: pref.fixo ? pref.qtd : 0, aprovadoPor: pref.aprovadoPor || "" };
  if (pref.itens && Object.keys(pref.itens).length) separarPorModelo(st, true);
  else if (pref.qtd) { disponiveis(tipo).slice(0, pref.qtd).forEach(c => st.sel.add(c)); }

}

  const dispR = msR === ms ? disp : disp.filter(c => msR.includes(inv(c).modelo));
  const dispM = st.modelo ? dispR.filter(c => inv(c).modelo === st.modelo) : dispR;

async function pedirAcesso(nome) {

    avisarEmail({ tipo: "pedido", nome, email: meuEmail() });
  }
}
async function novaPessoa(nome, extra = {}) {
  const p = { nome: nome.trim(), tipo: extra.tipo || "Profissional", cargo: extra.cargo || "", ativo: true, criadoEm: Date.now() };
  const ref = DB.collection("pessoas").doc();
  const ok = await write(() => ref.set(p));
  return ok ? { id: ref.id, ...p } : null;
}

async function registrarDevolucao(codes, nota, defeitos = {}) {
  const groups = new Map(), uso = emUsoMap();
  for (const c of codes) { const e = uso.get(c); if (e) { if (!groups.has(e.id)) groups.set(e.id, { e, codes: [] }); groups.get(e.id).codes.push(c); } }
  const agora = Date.now();
  for (const { e, codes: cs } of groups.values()) {
    const dev = {}; cs.forEach(c => dev[c] = { em: agora, por: opNome(), ...(nota ? { nota } : {}), ...(defeitos[c] ? { defeito: defeitos[c] } : {}), ...(agora > prazoDe(e) ? { atrasado: true } : {}) });
    const resta = pendentes(e).filter(c => !cs.includes(c));
    const patch = { devolvidos: dev };
    if (!resta.length) { patch.aberto = false; patch.devolvidoEm = agora; }
    const ok = await write(() => DB.doc("emprestimos/" + e.id).update(patch));
    if (!ok) return false;
  }
  return true;
}

document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act; if (!acts[a]) return;
  if (a === "ov" && ev.target !== t) return;
  if (a !== "wa") ev.preventDefault();
  if (!/^(cancelar-res|recusar-res|apagar-rec|desativar-p|remover-acesso|recusar|h-del|salvar-cfg)$/.test(a) && ui.armed) { ui.armed = null; if (!t.closest("#modal")) render(); }
  acts[a](t, ev);
});

  if (st) { const map = { "rt-turma": "turma", "rt-obs": "obs", "rt-qtd": "qtd", "ag-qtd": "qtd", "ag-turma": "turma", "ag-obs": "obs", "pr-motivo": "motivo", "pr-modelo": "modelo", "pr-pat": "patrimonio", "pr-local": "local", "dv-motivo": "defMotivo", "dvi-obs": "obs" }; if (map[id]) st[map[id]] = t.value; }

  if (t.id === "agenda-date" && t.value) { ui.date = t.value; subscribeReservas(); render(); }
});
document.addEventListener("keydown", (ev) => {

let toastT;
function toast(msg, ms = 2800) {
  let el = $(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, ms);

async function vigiarAtrasos() {
  if (!DB || !S.abertosOk) return;
  const k = "atrasosAvisados:" + dayKey(), vistos = new Set(store.get(k, []));
  for (const e of S.abertos) {
    if (!atrasado(e)) continue;
    const meu = e.responsavelEmail && e.responsavelEmail === meuEmail();
    if ((isEquipe() || meu) && !vistos.has(e.id)) {
      vistos.add(e.id); store.set(k, [...vistos]);
      avisarAparelho(meu && !isEquipe() ? "Sua devolução está atrasada" : "Devolução atrasada", `${e.pessoaNome}: ${resumoCodes(pendentes(e), e.tipo)} devia voltar ${fmtPrazo(prazoDe(e))}.`);
    }
    // E-mail uma vez só por retirada, mandado pelo primeiro aparelho da equipe que perceber.
    if (isEquipe() && CONF.avisoEmail && !e.atrasoAvisado && DB.umaVez && await DB.umaVez("emprestimos/" + e.id, "atrasoAvisado")) {
      const dados = { pessoa: e.pessoaNome, itens: resumoCodes(pendentes(e), e.tipo), codigos: pendentes(e).join(", "), prazo: fmtPrazo(prazoDe(e)) };
      avisarEmail({ tipo: "atraso", ...dados });
      if (e.responsavelEmail) avisarEmail({ tipo: "atraso", para: e.responsavelEmail, ...dados });
    }
  }
  scheduleRender();
}
function stopAll() { for (const k of Object.keys(unsub)) { unsub[k](); delete unsub[k]; } Object.assign(S, { config: null, configLoaded: false, pessoas: [], abertos: [], hist: [], parados: [], reservas: [], recados: [], acessos: [], meuAc: null, inv: {}, resHoje: [], futuras: [], pedidos: [], meuPedido: null, pedidoNoServidor: false, futurasOk: false, pedidosOk: false, abertosOk: false, resHojeOk: false }); ui.semAcesso = false; ui.importPrev = null; }
async function boot() {
  const conf = HOSTED && window.PARQUETEC_FIREBASE;
  if (HOSTED) {
    // Fora do claude.ai a planilha é baixada direto pelo navegador.
    downloads = { save: async ({ filename, data }) => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "text/csv;charset=utf-8" })); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); } };
    window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; scheduleRender(); });
    window.addEventListener("appinstalled", () => { installEvt = null; toast("App instalado! Procure o ícone do ParqueTEC."); scheduleRender(); });
    if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  if (conf && conf.apiKey) {
    try { FB = await firebaseDB(conf); }
    catch (e) { console.warn(e); $("#main").innerHTML = `<div class="card empty">Não deu para abrir o app. Confira a internet e <button class="link" onclick="location.reload()">tente de novo</button>.</div>`; return; }
    DB = FB.db; MODE = "firebase";
    FB.onAuth(u => {
      ui.authReady = true;
      if (!u) { AUTH = null; operador = null; ui.verificar = false; stopAll(); return render(); }
      const trocou = !AUTH || AUTH.uid !== u.uid;
      AUTH = u;
      if (trocou) operador = store.get(opKey(), null);
      // A coordenação (dono) precisa confirmar o e-mail antes de entrar: é isso que as regras do Firebase exigem.
      if (souDono() && !u.emailVerified) { ui.verificar = true; stopAll(); return render(); }
      ui.verificar = false;
      if (trocou || !Object.keys(unsub).length) { stopAll(); subscribeAll(); }
      render();
    });
  } else {
    let cloud = null;
    if (!HOSTED) {
      try { cloud = await window.claude.use("db"); } catch { cloud = null; }
      try { downloads = await window.claude.use("downloads"); } catch { downloads = null; }
    }
    if (cloud) { DB = cloud; MODE = "claude"; } else { DB = localDB(); MODE = "local"; }
    subscribeAll();
  }
  setInterval(vigiarAtrasos, 60000); setTimeout(vigiarAtrasos, 4000);
  setInterval(() => { const k = dayKey(); if (k !== boot.day) { if (Object.keys(unsub).length) { if (ui.date === boot.day) { ui.date = k; subscribeReservas(); } subscribeResHoje(); if (unsub.futuras) subscribeFuturas(); } boot.day = k; render(); } }, 60000);
  boot.day = dayKey();
}
render();
